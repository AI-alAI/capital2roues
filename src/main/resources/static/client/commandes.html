<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Commandes - Capital 2 Roues</title>
    <link rel="stylesheet" href="css/client-style.css">
    
    <script>
        // ============================================
        // GESTION DE LA LANGUE (FR/EN/AR)
        // ============================================
        const LANG_KEY = 'preferredLanguage';
        const translations = {
            fr: {
                'nav.home': '🏠 Accueil',
                'nav.catalogue': '📦 Catalogue',
                'nav.cart': '🛒 Panier',
                'nav.orders': '📋 Commandes',
                'nav.profile': '👤 Profil',
                'nav.login': '🔐 Connexion',
                'nav.logout': '🚪 Déconnexion',
                'nav.register': 'S\'inscrire',
                'commandes.title': '📋 Mes Commandes',
                'commandes.subtitle': 'Suivez l\'état de vos commandes',
                'commandes.empty': '📭 Aucune commande',
                'commandes.emptyHint': 'Vous n\'avez pas encore passé de commande',
                'commandes.viewCatalogue': '📍 Voir le catalogue',
                'commandes.client': 'Client',
                'commandes.products': 'Produits',
                'commandes.detail': '📄 Voir détail',
                'commandes.status.attente': '⏳ En attente',
                'commandes.status.confirmee': '✅ Confirmée',
                'commandes.status.livree': '📦 Livrée',
                'commandes.status.annulee': '❌ Annulée',
                'commandes.total': 'Total'
            },
            en: {
                'nav.home': '🏠 Home',
                'nav.catalogue': '📦 Catalogue',
                'nav.cart': '🛒 Cart',
                'nav.orders': '📋 Orders',
                'nav.profile': '👤 Profile',
                'nav.login': '🔐 Login',
                'nav.logout': '🚪 Logout',
                'nav.register': 'Sign up',
                'commandes.title': '📋 My Orders',
                'commandes.subtitle': 'Track your orders status',
                'commandes.empty': '📭 No orders',
                'commandes.emptyHint': 'You haven\'t placed any orders yet',
                'commandes.viewCatalogue': '📍 View catalogue',
                'commandes.client': 'Client',
                'commandes.products': 'Products',
                'commandes.detail': '📄 View details',
                'commandes.status.attente': '⏳ Pending',
                'commandes.status.confirmee': '✅ Confirmed',
                'commandes.status.livree': '📦 Delivered',
                'commandes.status.annulee': '❌ Cancelled',
                'commandes.total': 'Total'
            },
            ar: {
                'nav.home': '🏠 الرئيسية',
                'nav.catalogue': '📦 الكتالوج',
                'nav.cart': '🛒 السلة',
                'nav.orders': '📋 الطلبات',
                'nav.profile': '👤 الملف الشخصي',
                'nav.login': '🔐 تسجيل الدخول',
                'nav.logout': '🚪 تسجيل الخروج',
                'nav.register': 'إنشاء حساب',
                'commandes.title': '📋 طلباتي',
                'commandes.subtitle': 'تابع حالة طلباتك',
                'commandes.empty': '📭 لا توجد طلبات',
                'commandes.emptyHint': 'لم تقم بتقديم أي طلب بعد',
                'commandes.viewCatalogue': '📍 عرض الكتالوج',
                'commandes.client': 'العميل',
                'commandes.products': 'المنتجات',
                'commandes.detail': '📄 عرض التفاصيل',
                'commandes.status.attente': '⏳ قيد الانتظار',
                'commandes.status.confirmee': '✅ مؤكدة',
                'commandes.status.livree': '📦 تم التوصيل',
                'commandes.status.annulee': '❌ ملغاة',
                'commandes.total': 'المجموع'
            }
        };

        let currentLang = localStorage.getItem(LANG_KEY) || 'fr';

        function t(key) {
            return translations[currentLang]?.[key] || key;
        }

        function applyTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                const translation = t(key);
                if (el.tagName === 'INPUT' && el.type !== 'submit') {
                    el.placeholder = translation;
                } else if (el.tagName === 'INPUT' && el.type === 'submit') {
                    el.value = translation;
                } else if (el.tagName === 'BUTTON') {
                    el.innerHTML = translation;
                } else {
                    el.textContent = translation;
                }
            });
            
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                el.placeholder = t(el.getAttribute('data-i18n-placeholder'));
            });
            
            // Recharger les commandes pour mettre à jour les textes dynamiques
            if (typeof afficherCommandes === 'function') {
                afficherCommandes();
            }
        }

        function switchLanguage(lang) {
            if (lang === currentLang) return;
            currentLang = lang;
            localStorage.setItem(LANG_KEY, lang);
            applyTranslations();
            
            const selector = document.getElementById('languageSelector');
            if (selector) selector.value = lang;
            
            document.body.style.direction = lang === 'ar' ? 'rtl' : 'ltr';
            document.body.style.textAlign = lang === 'ar' ? 'right' : 'left';
        }

        document.addEventListener('DOMContentLoaded', function() {
            const selector = document.getElementById('languageSelector');
            if (selector) {
                selector.value = currentLang;
                selector.onchange = function() {
                    switchLanguage(this.value);
                };
            }
            applyTranslations();
            if (currentLang === 'ar') {
                document.body.style.direction = 'rtl';
                document.body.style.textAlign = 'right';
            }
            updateNavbar();
            updatePanierCount();
            afficherCommandes();
        });

        window.switchLanguage = switchLanguage;
        window.t = t;
    </script>
    
    <style>

    <nav class="client-navbar">

        <ul class="nav-links">

            <li><a href="panier.html" data-i18n="nav.cart">🛒 Panier <span class="badge" id="panierCount">0</span></a></li>

    <!-- ===== HEADER ===== -->
    <section class="header-commandes">
        <h1 data-i18n="commandes.title">📋 Mes Commandes</h1>
        <p data-i18n="commandes.subtitle">Suivez l'état de vos commandes</p>
    </section>

    <!-- ===== COMMANDES ===== -->
    <section class="section-commandes" id="commandesContainer">
        <div id="commandesContent"></div>
    </section>

    <script>
        // ============================================
        // AUTHENTIFICATION / NAVBAR
        // ============================================
        function updateNavbar() {
            const userInfo = document.getElementById('userInfo');
            const isLoggedIn = localStorage.getItem('clientLoggedIn') === 'true';
            if (isLoggedIn) {
                const prenom = localStorage.getItem('clientPrenom') || 'Client';
                const nom = localStorage.getItem('clientNom') || '';
                const initial = prenom.charAt(0).toUpperCase();
                userInfo.innerHTML = `
                    <span class="user-avatar-small">${initial}</span>
                    <span class="user-name-nav">${prenom} ${nom}</span>
                    <button class="btn-logout" onclick="logoutClient()" data-i18n="nav.logout">🚪 Déconnexion</button>
                `;
            } else {
                userInfo.innerHTML = `
                    <a href="login.html"><button class="btn-login" data-i18n="nav.login">🔐 Se connecter</button></a>
                    <a href="register.html"><button class="btn-login" style="background:#e94560;color:#fff;border-color:#e94560;" data-i18n="nav.register">S'inscrire</button></a>
                `;
            }
            applyTranslations();
        }

        function logoutClient() {
            localStorage.removeItem('clientId');
            localStorage.removeItem('clientEmail');
            localStorage.removeItem('clientNom');
            localStorage.removeItem('clientPrenom');
            localStorage.removeItem('clientRole');
            localStorage.removeItem('clientLoggedIn');
            localStorage.removeItem('clientTelephone');
            localStorage.removeItem('clientAdresse');
            window.location.href = 'index.html';
        }

        // ============================================
        // PANIER
        // ============================================
        function updatePanierCount() {
            const panier = JSON.parse(localStorage.getItem('panier')) || [];
            const total = panier.reduce((sum, p) => sum + p.quantite, 0);
            const badge = document.getElementById('panierCount');
            if (badge) badge.textContent = total;
        }

        // ============================================
        // FORMAT PRIX
        // ============================================
        function formatPrice(price) {
            return Number(price || 0).toLocaleString('fr-FR', {
                minimumFractionDigits: 0,
                maximumFractionDigits: 2
            });
        }

        // ============================================
        // RÉCUPÉRER LES COMMANDES (localStorage)
        // ============================================
        function getCommandes() {
            try {
                const commandes = JSON.parse(localStorage.getItem('commandes')) || [];
                console.log('📦 Commandes chargées:', commandes.length);
                return commandes;
            } catch (error) {
                console.error('Erreur chargement commandes:', error);
                return [];
            }
        }

        // ============================================
        // AFFICHER LES COMMANDES
        // ============================================
        function afficherCommandes() {
            const container = document.getElementById('commandesContent');
            const isLoggedIn = localStorage.getItem('clientLoggedIn') === 'true';

            // Vérifier si l'utilisateur est connecté
            if (!isLoggedIn) {
                container.innerHTML = `
                    <div class="aucune-commande">
                        <div class="icon">🔐</div>
                        <h2>Connectez-vous pour voir vos commandes</h2>
                        <p>Vous devez être connecté pour accéder à vos commandes</p>
                        <a href="login.html" class="btn-catalogue">🔐 Se connecter</a>
                    </div>
                `;
                return;
            }

            const commandes = getCommandes();

            if (commandes.length === 0) {
                container.innerHTML = `
                    <div class="aucune-commande">
                        <div class="icon">📋</div>
                        <h2 data-i18n="commandes.empty">Aucune commande</h2>
                        <p data-i18n="commandes.emptyHint">Vous n'avez pas encore passé de commande</p>
                        <a href="catalogue.html" class="btn-catalogue" data-i18n="commandes.viewCatalogue">📍 Voir le catalogue</a>
                    </div>
                `;
                applyTranslations();
                return;
            }

            // Trier par date (plus récent en premier)
            commandes.sort((a, b) => new Date(b.date) - new Date(a.date));

            let html = '';
            commandes.forEach((cmd, index) => {
                // Déterminer le statut
                let statusClass = 'status-attente';
                let statusText = t('commandes.status.attente');
                if (cmd.statut === 'Confirmée' || cmd.statut === 'Confirmé') {
                    statusClass = 'status-confirmee';
                    statusText = t('commandes.status.confirmee');
                } else if (cmd.statut === 'Livrée' || cmd.statut === 'Livré') {
                    statusClass = 'status-livree';
                    statusText = t('commandes.status.livree');
                } else if (cmd.statut === 'Annulée' || cmd.statut === 'Annulé') {
                    statusClass = 'status-annulee';
                    statusText = t('commandes.status.annulee');
                }

                const totalArticles = cmd.articles ? cmd.articles.reduce((sum, a) => sum + a.quantite, 0) : 0;
                const id = cmd.id || (index + 1);

                html += `
                    <div class="commande-card">
                        <div class="commande-header">
                            <div>
                                <span class="commande-id">#${id}</span>
                                <span class="commande-date">📅 ${cmd.date || 'Date inconnue'}</span>
                            </div>
                            <span class="status-badge ${statusClass}">${statusText}</span>
                            <span class="commande-total">${formatPrice(cmd.total || 0)} DH</span>
                        </div>

                        <div class="commande-body">
                            <div class="commande-produits">
                                ${cmd.articles && cmd.articles.length > 0 ? cmd.articles.map(article => `
                                    <div class="commande-produit">
                                        <span class="produit-nom">🏍️ ${article.nom || 'Produit'}</span>
                                        <span class="produit-quantite">x ${article.quantite}</span>
                                        <span class="produit-prix">${formatPrice(article.prix * article.quantite)} DH</span>
                                    </div>
                                `).join('') : '<p style="color:#636e72;">Aucun article</p>'}
                            </div>

                            <div style="display:flex;justify-content:space-between;font-size:14px;color:#636e72;margin-top:5px;">
                                <span>${totalArticles} article${totalArticles > 1 ? 's' : ''}</span>
                            </div>

                            <div class="commande-footer">
                                <button class="btn-supprimer" onclick="supprimerCommande(${id})">🗑️ Supprimer</button>
                                <button class="btn-detail" onclick="voirDetailCommande(${id})" data-i18n="commandes.detail">📄 Voir détail</button>
                            </div>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
            applyTranslations();
        }

        // ============================================
        // VOIR DÉTAIL D'UNE COMMANDE
        // ============================================
        function voirDetailCommande(id) {
            const commandes = getCommandes();
            const cmd = commandes.find(c => c.id === id);
            if (!cmd) {
                alert('Commande non trouvée');
                return;
            }

            const articles = cmd.articles ? cmd.articles.map(a => 
                `- ${a.nom} x ${a.quantite} = ${formatPrice(a.prix * a.quantite)} DH`
            ).join('\n') : 'Aucun article';

            alert(
                `📋 Détail de la commande #${id}\n\n` +
                `📅 Date : ${cmd.date}\n` +
                `📦 Statut : ${cmd.statut || 'En attente'}\n` +
                `\n🛒 Articles :\n${articles}\n\n` +
                `💰 Total : ${formatPrice(cmd.total)} DH`
            );
        }

        // ============================================
        // SUPPRIMER UNE COMMANDE
        // ============================================
        function supprimerCommande(id) {
            if (confirm('Voulez-vous vraiment supprimer cette commande ?')) {
                let commandes = getCommandes();
                commandes = commandes.filter(c => c.id !== id);
                localStorage.setItem('commandes', JSON.stringify(commandes));
                afficherCommandes();
            }
        }

        // ============================================
        // INITIALISATION
        // ============================================
        // La fonction est déjà appelée dans le DOMContentLoaded

        // Exposer les fonctions globalement
        window.logoutClient = logoutClient;
        window.supprimerCommande = supprimerCommande;
        window.voirDetailCommande = voirDetailCommande;
        window.afficherCommandes = afficherCommandes;
    </script>

</body>
</html>
