<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion - Capital 2 Roues</title>
    <link rel="stylesheet" href="css/client-style.css">
    
    <script>
        // ============================================
        // GESTION DE LA LANGUE (FR/EN/AR)
        // ============================================
        const LANG_KEY = 'preferredLanguage';
        const translations = {
            fr: {
                'login.title': '🏍️ Capital 2 Roues',
                'login.subtitle': 'Connectez-vous à votre espace client',
                'login.email': 'Email',
                'login.password': 'Mot de passe',
                'login.submit': 'Se connecter',
                'login.registerLink': 'Créer un compte',
                'login.backHome': 'Retour à l\'accueil',
                'login.error': '❌ Email ou mot de passe incorrect',
                'login.success': '✅ Connexion réussie ! Redirection en cours...',
                'login.loading': '⏳ Connexion...',
                'login.debug.loaded': '🚀 Page chargée',
                'login.debug.hint1': '💡 Utilisez: client@test.com / 123456',
                'login.placeholder.email': 'client@email.com',
                'login.placeholder.password': 'Votre mot de passe'
            },
            en: {
                'login.title': '🏍️ Capital 2 Roues',
                'login.subtitle': 'Login to your client space',
                'login.email': 'Email',
                'login.password': 'Password',
                'login.submit': 'Login',
                'login.registerLink': 'Create an account',
                'login.backHome': 'Back to home',
                'login.error': '❌ Incorrect email or password',
                'login.success': '✅ Login successful! Redirecting...',
                'login.loading': '⏳ Logging in...',
                'login.debug.loaded': '🚀 Page loaded',
                'login.debug.hint1': '💡 Use: client@test.com / 123456',
                'login.placeholder.email': 'client@email.com',
                'login.placeholder.password': 'Your password'
            },
            ar: {
                'login.title': '🏍️ كابيتال 2 ويلز',
                'login.subtitle': 'تسجيل الدخول إلى مساحتك الشخصية',
                'login.email': 'البريد الإلكتروني',
                'login.password': 'كلمة المرور',
                'login.submit': 'تسجيل الدخول',
                'login.registerLink': 'إنشاء حساب',
                'login.backHome': 'العودة إلى الرئيسية',
                'login.error': '❌ البريد الإلكتروني أو كلمة المرور غير صحيحة',
                'login.success': '✅ تم تسجيل الدخول بنجاح! جاري التحويل...',
                'login.loading': '⏳ جاري تسجيل الدخول...',
                'login.debug.loaded': '🚀 تم تحميل الصفحة',
                'login.debug.hint1': '💡 استخدم: client@test.com / 123456',
                'login.placeholder.email': 'client@email.com',
                'login.placeholder.password': 'كلمة المرور الخاصة بك'
            }
        };

        let currentLang = localStorage.getItem(LANG_KEY) || 'fr';

        function t(key) {
            return translations[currentLang]?.[key] || key;
        }

        function applyTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                const translation = t(key);
                if (el.tagName === 'INPUT' && el.type !== 'submit') {
                    el.placeholder = translation;
                } else if (el.tagName === 'INPUT' && el.type === 'submit') {
                    el.value = translation;
                } else if (el.tagName === 'BUTTON') {
                    el.textContent = translation;
                } else {
                    el.textContent = translation;
                }
            });
            
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                el.placeholder = t(el.getAttribute('data-i18n-placeholder'));
            });
        }

        function switchLanguage(lang) {
            if (lang === currentLang) return;
            currentLang = lang;
            localStorage.setItem(LANG_KEY, lang);
            applyTranslations();
            
            const selector = document.getElementById('languageSelector');
            if (selector) selector.value = lang;
            
            document.body.style.direction = lang === 'ar' ? 'rtl' : 'ltr';
            document.body.style.textAlign = lang === 'ar' ? 'right' : 'left';
        }

        document.addEventListener('DOMContentLoaded', function() {
            const selector = document.getElementById('languageSelector');
            if (selector) {
                selector.value = currentLang;
                selector.onchange = function() {
                    switchLanguage(this.value);
                };
            }
            applyTranslations();
            if (currentLang === 'ar') {
                document.body.style.direction = 'rtl';
                document.body.style.textAlign = 'right';
            }
            logDebug(t('login.debug.loaded'), 'info');
            logDebug(t('login.debug.hint1'), 'info');
        });

        window.switchLanguage = switchLanguage;
        window.t = t;
    </script>
    
    <style>
        .input-group { position: relative; }
        .toggle-password {
            position: absolute; right: 12px; top: 35px;
            cursor: pointer; background: none; border: none;
            font-size: 16px; color: #888;
        }
        .toggle-password:hover { color: #333; }
        .debug-info {
            background: #f8f9fa; padding: 10px; border-radius: 5px;
            font-size: 12px; color: #666; margin-top: 10px;
            display: none; max-height: 200px; overflow: auto;
            border: 1px solid #eee; font-family: 'Courier New', monospace;
        }
        .debug-info .success { color: #4CAF50; }
        .debug-info .error { color: #e94560; }
        .debug-info .info { color: #2196F3; }
        
        .btn-primary:disabled { opacity: 0.6; cursor: not-allowed; }
        
        .alert-client {
            padding: 12px 15px; border-radius: 8px; margin-bottom: 15px;
            display: none; font-size: 14px;
        }
        .alert-client.success {
            background: #d4edda; color: #155724; border: 1px solid #c3e6cb;
            display: block;
        }
        .alert-client.error {
            background: #f8d7da; color: #721c24; border: 1px solid #f5c6cb;
            display: block;
        }
        
        .language-selector { text-align: right; margin-bottom: 15px; }
        .language-select {
            padding: 6px 12px; border-radius: 5px;
            border: 1px solid #ddd; background: #fff;
            cursor: pointer; font-size: 14px;
        }

        .auth-container {
            display: flex; justify-content: center; align-items: center;
            min-height: 100vh;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            padding: 20px;
        }

        .auth-box {
            background: white; padding: 40px; border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
            width: 100%; max-width: 450px;
        }

        .auth-box h1 { text-align: center; font-size: 24px; color: #333; margin-bottom: 5px; }
        .auth-box .subtitle { text-align: center; color: #666; font-size: 14px; margin-bottom: 25px; }

        .form-group { margin-bottom: 20px; }
        .form-group label { display: block; margin-bottom: 5px; font-weight: 600; color: #333; font-size: 14px; }
        .form-group input {
            width: 100%; padding: 12px; border: 2px solid #e0e0e0;
            border-radius: 8px; font-size: 14px; transition: border-color 0.3s;
            box-sizing: border-box;
        }
        .form-group input:focus { border-color: #667eea; outline: none; }

        .btn-primary {
            width: 100%; padding: 14px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; border: none; border-radius: 8px;
            font-size: 16px; font-weight: 600; cursor: pointer;
            transition: transform 0.2s;
        }
        .btn-primary:hover { transform: translateY(-2px); }
        .btn-primary:disabled { opacity: 0.6; transform: none; }

        .auth-links { text-align: center; margin-top: 20px; font-size: 14px; }
        .auth-links a { color: #667eea; text-decoration: none; margin: 0 5px; }
        .auth-links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <div class="language-selector">
                <select id="languageSelector" class="language-select">
                    <option value="fr">🇫🇷 Français</option>
                    <option value="en">🇬🇧 English</option>
                    <option value="ar">🇸🇦 العربية</option>
                </select>
            </div>
            
            <h1 data-i18n="login.title">🏍️ Capital 2 Roues</h1>
            <p class="subtitle" data-i18n="login.subtitle">Connectez-vous à votre espace client</p>
            
            <div id="alert" class="alert-client"></div>
            
            <form id="loginForm">
                <div class="form-group">
                    <label data-i18n="login.email">Email</label>
                    <input type="email" id="email" data-i18n-placeholder="login.placeholder.email" value="client@test.com" required>
                </div>
                <div class="form-group">
                    <label data-i18n="login.password">Mot de passe</label>
                    <div class="input-group">
                        <input type="password" id="motDePasse" data-i18n-placeholder="login.placeholder.password" value="123456" required>
                        <button type="button" class="toggle-password" onclick="togglePassword()">👁️</button>
                    </div>
                </div>
                <button type="submit" class="btn-primary" id="loginBtn" data-i18n="login.submit">Se connecter</button>
            </form>
            
            <div id="debugInfo" class="debug-info"></div>
            
            <div class="auth-links">
                <a href="register.html" data-i18n="login.registerLink">Créer un compte</a> | 
                <a href="index.html" data-i18n="login.backHome">Retour à l'accueil</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';
        
        function togglePassword() {
            const input = document.getElementById('motDePasse');
            const btn = document.querySelector('.toggle-password');
            if (input.type === 'password') {
                input.type = 'text';
                btn.textContent = '🙈';
            } else {
                input.type = 'password';
                btn.textContent = '👁️';
            }
        }

        function logDebug(message, type = 'info') {
            const debugDiv = document.getElementById('debugInfo');
            debugDiv.style.display = 'block';
            const color = type === 'success' ? '#4CAF50' : type === 'error' ? '#e94560' : '#2196F3';
            debugDiv.innerHTML += `<span style="color:${color}">${new Date().toLocaleTimeString()}</span> - ${message}<br>`;
            debugDiv.scrollTop = debugDiv.scrollHeight;
            console.log(message);
        }

        // ===== LOGIN AVEC API =====
        document.getElementById('loginForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const email = document.getElementById('email').value.trim();
            const motDePasse = document.getElementById('motDePasse').value;
            const alert = document.getElementById('alert');
            const debugDiv = document.getElementById('debugInfo');
            const loginBtn = document.getElementById('loginBtn');
            
            alert.style.display = 'none';
            alert.className = 'alert-client';
            debugDiv.innerHTML = '';
            debugDiv.style.display = 'block';
            
            logDebug('🔍 Tentative de connexion...', 'info');
            logDebug('📧 Email: "' + email + '"', 'info');
            
            loginBtn.disabled = true;
            loginBtn.textContent = t('login.loading');
            
            try {
                // Appel à l'API /api/login
                logDebug('📡 Appel API: /api/login', 'info');
                const response = await fetch(`${API_BASE}/login`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                    },
                    body: JSON.stringify({
                        email: email,
                        motDePasse: motDePasse
                    })
                });
                
                // Lire la réponse
                const data = await response.json();
                
                if (!response.ok) {
                    throw new Error(data.error || 'Email ou mot de passe incorrect');
                }
                
                if (data.success && data.user) {
                    logDebug('✅ Connexion réussie !', 'success');
                    logDebug('👤 Utilisateur: ' + data.user.email + ' (' + data.user.role + ')', 'success');
                    
                    // Stocker les informations
                    localStorage.setItem('clientId', data.user.id);
                    localStorage.setItem('clientEmail', data.user.email);
                    localStorage.setItem('clientNom', data.user.nom);
                    localStorage.setItem('clientPrenom', data.user.prenom);
                    localStorage.setItem('clientRole', data.user.role);
                    localStorage.setItem('clientLoggedIn', 'true');
                    
                    alert.className = 'alert-client success';
                    alert.textContent = t('login.success');
                    alert.style.display = 'block';
                    
                    setTimeout(() => {
                        window.location.href = 'index.html';
                    }, 1500);
                } else {
                    throw new Error('Erreur inconnue lors de la connexion');
                }
                
            } catch (error) {
                logDebug('❌ Erreur: ' + error.message, 'error');
                alert.className = 'alert-client error';
                alert.textContent = '❌ ' + error.message;
                alert.style.display = 'block';
            }
            
            loginBtn.disabled = false;
            loginBtn.textContent = t('login.submit');
        });
    </script>
</body>
</html>
