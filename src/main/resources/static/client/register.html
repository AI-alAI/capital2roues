<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Inscription - Capital 2 Roues</title>
    <link rel="stylesheet" href="css/client-style.css">
    
    <script>
        // ============================================
        // GESTION DE LA LANGUE (FR/EN/AR)
        // ============================================
        const LANG_KEY = 'preferredLanguage';
        const translations = {
            fr: {
                'register.title': '🏍️ Capital 2 Roues',
                'register.subtitle': 'Créer votre compte client',
                'register.nom': 'Nom *',
                'register.prenom': 'Prénom *',

                'register.submit': 'S\'inscrire',
                'register.loginLink': 'Déjà un compte ? Se connecter',
                'register.backHome': 'Retour à l\'accueil',
                'register.success': '✅ Compte créé avec succès ! Vous allez être redirigé...',
                'register.error': '❌ Erreur: ',
                'register.required': '❌ Veuillez remplir tous les champs obligatoires (*)',
                'register.invalidEmail': '❌ Veuillez entrer un email valide',
                'register.passwordMatch': '❌ Les mots de passe ne correspondent pas',
                'register.passwordMin': '❌ Le mot de passe doit contenir au moins 6 caractères',
                'register.loading': 'Création du compte...',
                'register.placeholder.nom': 'Votre nom',
                'register.placeholder.prenom': 'Votre prénom',
                'register.placeholder.email': 'client@email.com',
                'register.placeholder.telephone': '0612345678',
                'register.placeholder.adresse': 'Votre adresse',
                'register.placeholder.password': 'Min 6 caractères',
                'register.placeholder.confirmPassword': 'Confirmer',
                'register.passwordHint': 'Le mot de passe doit contenir au moins 6 caractères',
                'register.passwordWeak': '⚠️ Mot de passe trop court (minimum 6 caractères)',
                'register.passwordMedium': '🟡 Mot de passe moyen (ajoutez des majuscules et chiffres)',
                'register.passwordStrong': '✅ Mot de passe fort'
            },
            en: {
                'register.title': '🏍️ Capital 2 Roues',
                'register.subtitle': 'Create your client account',
                'register.nom': 'Last name *',
                'register.prenom': 'First name *',
                'register.email': 'Email *',
                'register.telephone': 'Phone',
                'register.adresse': 'Address',
                'register.password': 'Password *',
                'register.confirmPassword': 'Confirm password *',
                'register.submit': 'Sign up',
                'register.loginLink': 'Already have an account? Login',
                'register.backHome': 'Back to home',
                'register.success': '✅ Account created successfully! Redirecting...',
                'register.error': '❌ Error: ',
                'register.required': '❌ Please fill in all required fields (*)',
                'register.invalidEmail': '❌ Please enter a valid email',
                'register.passwordMatch': '❌ Passwords do not match',
                'register.passwordMin': '❌ Password must be at least 6 characters',
                'register.loading': 'Creating account...',
                'register.placeholder.nom': 'Your last name',
                'register.placeholder.prenom': 'Your first name',
                'register.placeholder.email': 'client@email.com',
                'register.placeholder.telephone': '0612345678',
                'register.placeholder.adresse': 'Your address',
                'register.placeholder.password': 'Min 6 characters',
                'register.placeholder.confirmPassword': 'Confirm',
                'register.passwordHint': 'Password must be at least 6 characters',
                'register.passwordWeak': '⚠️ Password too short (minimum 6 characters)',
                'register.passwordMedium': '🟡 Medium password (add uppercase and numbers)',
                'register.passwordStrong': '✅ Strong password'
            },
            ar: {
                'register.title': '🏍️ كابيتال 2 ويلز',
                'register.subtitle': 'إنشاء حساب عميل',
                'register.nom': 'الاسم العائلي *',
                'register.prenom': 'الاسم الشخصي *',
                'register.email': 'البريد الإلكتروني *',
                'register.telephone': 'رقم الهاتف',
                'register.adresse': 'العنوان',
                'register.password': 'كلمة المرور *',
                'register.confirmPassword': 'تأكيد كلمة المرور *',
                'register.submit': 'إنشاء حساب',
                'register.loginLink': 'لديك حساب بالفعل؟ تسجيل الدخول',
                'register.backHome': 'العودة إلى الرئيسية',
                'register.success': '✅ تم إنشاء الحساب بنجاح! جاري التحويل...',
                'register.error': '❌ خطأ: ',
                'register.required': '❌ يرجى ملء جميع الحقول الإلزامية (*)',
                'register.invalidEmail': '❌ يرجى إدخال بريد إلكتروني صحيح',
                'register.passwordMatch': '❌ كلمات المرور غير متطابقة',
                'register.passwordMin': '❌ يجب أن تحتوي كلمة المرور على 6 أحرف على الأقل',
                'register.loading': 'جاري إنشاء الحساب...',
                'register.placeholder.nom': 'اسم العائلة',
                'register.placeholder.prenom': 'الاسم الشخصي',
                'register.placeholder.email': 'client@email.com',
                'register.placeholder.telephone': '0612345678',
                'register.placeholder.adresse': 'عنوانك',
                'register.placeholder.password': '6 أحرف على الأقل',
                'register.placeholder.confirmPassword': 'تأكيد',
                'register.passwordHint': 'يجب أن تحتوي كلمة المرور على 6 أحرف على الأقل',
                'register.passwordWeak': '⚠️ كلمة المرور قصيرة جداً (6 أحرف على الأقل)',
                'register.passwordMedium': '🟡 كلمة مرور متوسطة (أضف أحرفاً كبيرة وأرقاماً)',
                'register.passwordStrong': '✅ كلمة مرور قوية'
            }
        };

        let currentLang = localStorage.getItem(LANG_KEY) || 'fr';

        function t(key) {
            return translations[currentLang]?.[key] || key;
        }

        function applyTranslations() {
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                const translation = t(key);
                if (el.tagName === 'INPUT' && el.type !== 'submit') {
                    el.placeholder = translation;
                } else if (el.tagName === 'INPUT' && el.type === 'submit') {
                    el.value = translation;
                } else if (el.tagName === 'BUTTON') {
                    el.innerHTML = translation;
                } else {
                    el.textContent = translation;
                }
            });
            
            document.querySelectorAll('[data-i18n-placeholder]').forEach(el => {
                el.placeholder = t(el.getAttribute('data-i18n-placeholder'));
            });
        }

        function switchLanguage(lang) {
            if (lang === currentLang) return;
            currentLang = lang;
            localStorage.setItem(LANG_KEY, lang);
            applyTranslations();
            
            const selector = document.getElementById('languageSelector');
            if (selector) selector.value = lang;
            
            document.body.style.direction = lang === 'ar' ? 'rtl' : 'ltr';
            document.body.style.textAlign = lang === 'ar' ? 'right' : 'left';
        }

        document.addEventListener('DOMContentLoaded', function() {
            const selector = document.getElementById('languageSelector');
            if (selector) {
                selector.value = currentLang;
                selector.onchange = function() {
                    switchLanguage(this.value);
                };
            }
            applyTranslations();
            if (currentLang === 'ar') {
                document.body.style.direction = 'rtl';
                document.body.style.textAlign = 'right';
            }
            // Initialiser la validation
            initValidation();
        });

        window.switchLanguage = switchLanguage;
        window.t = t;
    </script>
    
    <style>
        .language-selector {
            text-align: right;
            margin-bottom: 15px;
        }
        .language-select {
            padding: 6px 12px;
            border-radius: 5px;
            border: 1px solid #ddd;
            background: #fff;
            cursor: pointer;
            font-size: 14px;
        }
        .password-strength {
            height: 4px;
            border-radius: 2px;
            margin-top: 5px;
            background: #eee;
            transition: all 0.3s;
        }
        .password-strength.weak { background: #e94560; width: 33%; }
        .password-strength.medium { background: #FF9800; width: 66%; }
        .password-strength.strong { background: #4CAF50; width: 100%; }
        
        .password-hint {
            font-size: 12px;
            color: #888;
            margin-top: 3px;
        }
        
        .input-success {
            border-color: #4CAF50 !important;
            background: #f0fff0 !important;
        }
        .input-error {
            border-color: #e94560 !important;
            background: #fff0f0 !important;
        }
        
        .loading-spinner {
            display: none;
            text-align: center;
            padding: 10px;
        }
        .loading-spinner.active {
            display: block;
        }
        .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #e94560;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .alert-client {
            padding: 12px 15px;
            border-radius: 8px;
            margin-bottom: 15px;
            display: none;
            font-size: 14px;
        }
        .alert-client.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }
        .alert-client.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
    </style>
</head>
<body>
    <div class="auth-container">
        <div class="auth-box">
            <!-- ===== SÉLECTEUR DE LANGUE ===== -->
            <div class="language-selector">
                <select id="languageSelector" class="language-select">
                    <option value="fr">🇫🇷 Français</option>
                    <option value="en">🇬🇧 English</option>
                    <option value="ar">🇸🇦 العربية</option>
                </select>
            </div>
            
            <h1 data-i18n="register.title">🏍️ Capital 2 Roues</h1>
            <p class="subtitle" data-i18n="register.subtitle">Créer votre compte client</p>
            
            <div id="alert" class="alert-client"></div>
            
            <form id="registerForm" novalidate>
                <!-- Nom -->
                <div class="form-group">
                    <label data-i18n="register.nom">Nom <span style="color:#e94560;">*</span></label>
                    <input type="text" id="nom" data-i18n-placeholder="register.placeholder.nom" required>
                </div>
                
                <!-- Prénom -->
                <div class="form-group">
                    <label data-i18n="register.prenom">Prénom <span style="color:#e94560;">*</span></label>
                    <input type="text" id="prenom" data-i18n-placeholder="register.placeholder.prenom" required>
                </div>
                
                <!-- Email -->
                <div class="form-group">
                    <label data-i18n="register.email">Email <span style="color:#e94560;">*</span></label>
                    <input type="email" id="email" data-i18n-placeholder="register.placeholder.email" required>
                </div>
                
                <!-- Téléphone -->
                <div class="form-group">
                    <label data-i18n="register.telephone">Téléphone</label>
                    <input type="tel" id="telephone" data-i18n-placeholder="register.placeholder.telephone">
                </div>
                
                <!-- Adresse -->
                <div class="form-group">
                    <label data-i18n="register.adresse">Adresse</label>
                    <input type="text" id="adresse" data-i18n-placeholder="register.placeholder.adresse">
                </div>
                
                <!-- Mot de passe -->
                <div class="form-group">
                    <label data-i18n="register.password">Mot de passe <span style="color:#e94560;">*</span></label>
                    <input type="password" id="motDePasse" data-i18n-placeholder="register.placeholder.password" required minlength="6">
                    <div class="password-strength" id="passwordStrength"></div>
                    <div class="password-hint" id="passwordHint" data-i18n="register.passwordHint">Le mot de passe doit contenir au moins 6 caractères</div>
                </div>
                
                <!-- Confirmer mot de passe -->
                <div class="form-group">
                    <label data-i18n="register.confirmPassword">Confirmer le mot de passe <span style="color:#e94560;">*</span></label>
                    <input type="password" id="confirmPassword" data-i18n-placeholder="register.placeholder.confirmPassword" required>
                </div>
                
                <!-- Loading -->
                <div class="loading-spinner" id="loadingSpinner">
                    <div class="spinner"></div>
                    <p style="color:#888; font-size:13px; margin-top:10px;" data-i18n="register.loading">Création du compte...</p>
                </div>
                
                <button type="submit" class="btn-primary" id="submitBtn" data-i18n="register.submit">S'inscrire</button>
            </form>
            
            <div class="auth-links">
                <a href="login.html" data-i18n="register.loginLink">Déjà un compte ? Se connecter</a>
                <br>
                <a href="index.html" style="color:#888; font-size:13px;" data-i18n="register.backHome">Retour à l'accueil</a>
            </div>
        </div>
    </div>

    <script>
        const API_BASE = 'http://localhost:8080/api';

        // ===== VALIDATION DES CHAMPS =====
        const nomInput = document.getElementById('nom');
        const prenomInput = document.getElementById('prenom');
        const emailInput = document.getElementById('email');
        const passwordInput = document.getElementById('motDePasse');
        const confirmInput = document.getElementById('confirmPassword');

        function initValidation() {
            [nomInput, prenomInput, emailInput, passwordInput, confirmInput].forEach(input => {
                input.addEventListener('blur', function() {
                    validateField(this);
                });
                input.addEventListener('input', function() {
                    if (this.value.length > 0) {
                        validateField(this);
                    }
                    if (this.id === 'motDePasse') {
                        checkPasswordStrength(this.value);
                    }
                    if (this.id === 'confirmPassword') {
                        checkPasswordMatch();
                    }
                });
            });
        }

        function validateField(input) {
            if (input.value.trim().length === 0) {
                input.classList.remove('input-success');
                input.classList.add('input-error');
                return false;
            }
            if (input.type === 'email' && !isValidEmail(input.value)) {
                input.classList.remove('input-success');
                input.classList.add('input-error');
                return false;
            }
            input.classList.remove('input-error');
            input.classList.add('input-success');
            return true;
        }

        function isValidEmail(email) {
            return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
        }

        function checkPasswordStrength(password) {
            const strength = document.getElementById('passwordStrength');
            const hint = document.getElementById('passwordHint');
            
            if (password.length === 0) {
                strength.className = 'password-strength';
                hint.textContent = t('register.passwordHint');
                return;
            }
            
            if (password.length < 6) {
                strength.className = 'password-strength weak';
                hint.textContent = t('register.passwordWeak');
                return;
            }
            
            if (password.length >= 8 && /[A-Z]/.test(password) && /[0-9]/.test(password)) {
                strength.className = 'password-strength strong';
                hint.textContent = t('register.passwordStrong');
            } else if (password.length >= 6) {
                strength.className = 'password-strength medium';
                hint.textContent = t('register.passwordMedium');
            }
        }

        function checkPasswordMatch() {
            const password = passwordInput.value;
            const confirm = confirmInput.value;
            
            if (confirm.length === 0) return;
            
            if (password === confirm) {
                confirmInput.classList.remove('input-error');
                confirmInput.classList.add('input-success');
            } else {
                confirmInput.classList.remove('input-success');
                confirmInput.classList.add('input-error');
            }
        }

        // ===== SOUMISSION DU FORMULAIRE =====
        document.getElementById('registerForm').addEventListener('submit', async function(e) {
            e.preventDefault();
            
            const nom = nomInput.value.trim();
            const prenom = prenomInput.value.trim();
            const email = emailInput.value.trim();
            const telephone = document.getElementById('telephone').value.trim();
            const adresse = document.getElementById('adresse').value.trim();
            const motDePasse = passwordInput.value;
            const confirm = confirmInput.value;
            const alert = document.getElementById('alert');
            const loading = document.getElementById('loadingSpinner');
            const submitBtn = document.getElementById('submitBtn');
            
            alert.style.display = 'none';
            alert.className = 'alert-client';
            
            // Validation des champs obligatoires
            if (!nom || !prenom || !email || !motDePasse) {
                alert.className = 'alert-client error';
                alert.textContent = t('register.required');
                alert.style.display = 'block';
                return;
            }
            
            if (!isValidEmail(email)) {
                alert.className = 'alert-client error';
                alert.textContent = t('register.invalidEmail');
                alert.style.display = 'block';
                return;
            }
            
            if (motDePasse !== confirm) {
                alert.className = 'alert-client error';
                alert.textContent = t('register.passwordMatch');
                alert.style.display = 'block';
                return;
            }
            
            if (motDePasse.length < 6) {
                alert.className = 'alert-client error';
                alert.textContent = t('register.passwordMin');
                alert.style.display = 'block';
                return;
            }
            
            // Désactiver le bouton et afficher le loading
            submitBtn.disabled = true;
            submitBtn.style.opacity = '0.6';
            loading.classList.add('active');
            
            try {
                // 1. Créer l'utilisateur
                const response = await fetch(`${API_BASE}/utilisateurs`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nom: nom,
                        prenom: prenom,
                        email: email,
                        motDePasse: motDePasse,
                        role: 'CLIENT'
                    })
                });
                
                if (!response.ok) {
                    const errorText = await response.text();
                    let errorMsg = 'Une erreur est survenue';
                    try {
                        const errorJson = JSON.parse(errorText);
                        errorMsg = errorJson.message || errorText;
                    } catch(e) {
                        errorMsg = errorText;
                    }
                    alert.className = 'alert-client error';
                    alert.textContent = t('register.error') + errorMsg;
                    alert.style.display = 'block';
                    submitBtn.disabled = false;
                    submitBtn.style.opacity = '1';
                    loading.classList.remove('active');
                    return;
                }
                
                const user = await response.json();
                
                // 2. Ajouter le client dans la table clients
                await fetch(`${API_BASE}/clients`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        nom: nom,
                        prenom: prenom,
                        telephone: telephone || '',
                        email: email,
                        adresse: adresse || ''
                    })
                });
                
                // Succès
                alert.className = 'alert-client success';
                alert.textContent = t('register.success');
                alert.style.display = 'block';
                
                // Rediriger après 2 secondes
                setTimeout(() => {
                    window.location.href = 'login.html';
                }, 2000);
                
            } catch (error) {
                alert.className = 'alert-client error';
                alert.textContent = t('register.error') + error.message;
                alert.style.display = 'block';
                submitBtn.disabled = false;
                submitBtn.style.opacity = '1';
                loading.classList.remove('active');
            }
        });
    </script>
</body>
</html>
