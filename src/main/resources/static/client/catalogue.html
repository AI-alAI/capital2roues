<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catalogue - Capital 2 Roues</title>
    <link rel="stylesheet" href="css/client-style.css">
    
    <style>
        /* ===== STYLES GLOBAUX ===== */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #f5f6fa;
            min-height: 100vh;
        }

        /* ===== NAVBAR ===== */
        .client-navbar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 12px 30px;
            background: #1a1a2e;
            color: #fff;
            flex-wrap: wrap;
            gap: 8px;
        }
        
        .client-navbar .brand h1 {
            font-size: 18px;
            margin: 0;
        }
        .client-navbar .brand small {
            color: #a0a0b1;
            font-size: 11px;
        }
        
        .nav-links {
            display: flex;
            list-style: none;
            gap: 12px;
            margin: 0;
            padding: 0;
        }
        .nav-links a {
            color: #a0a0b1;
            text-decoration: none;
            font-size: 13px;
            transition: color 0.3s;
            padding: 4px 10px;
            border-radius: 5px;
        }
        .nav-links a:hover,
        .nav-links a.active {
            color: #fff;
            background: rgba(255,255,255,0.1);
        }
        .nav-links a.active {
            background: #e94560;
        }
        
        .nav-links .badge {
            background: #e94560;
            color: #fff;
            border-radius: 50%;
            padding: 1px 8px;
            font-size: 11px;
            margin-left: 3px;
        }
        
        .language-selector {
            margin-left: 10px;
        }
        .language-select {
            padding: 5px 10px;
            border-radius: 5px;
            border: 1px solid #444;
            background: #2d2d44;
            color: #fff;
            cursor: pointer;
            font-size: 12px;
        }
        .language-select option {
            background: #1a1a2e;
        }
        
        .user-info-nav {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .user-avatar-small {
            width: 28px;
            height: 28px;
            border-radius: 50%;
            background: #e94560;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: 700;
            font-size: 12px;
            color: #fff;
        }
        .user-name-nav {
            font-size: 13px;
            color: #fff;
        }
        .btn-logout {
            padding: 4px 14px;
            background: transparent;
            border: 1px solid #e94560;
            color: #e94560;
            border-radius: 5px;
            cursor: pointer;
            font-size: 11px;
            transition: all 0.3s;
        }
        .btn-logout:hover {
            background: #e94560;
            color: #fff;
        }
        .btn-login {
            padding: 6px 16px;
            background: transparent;
            border: 1px solid #a0a0b1;
            color: #a0a0b1;
            border-radius: 5px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
            text-decoration: none;
        }
        .btn-login:hover {
            background: #a0a0b1;
            color: #1a1a2e;
        }

        /* ===== HEADER CATALOGUE ===== */
        .catalogue-header {
            background: linear-gradient(135deg, #1a1a2e, #16213e);
            color: #fff;
            padding: 25px 30px;
            text-align: center;
        }
        .catalogue-header h1 {
            font-size: 26px;
            margin-bottom: 4px;
        }
        .catalogue-header p {
            color: #a0a0b1;
            font-size: 13px;
        }

        /* ===== SECTION PRODUITS ===== */
        .products-section {
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 30px;
        }

        /* ===== FILTRES ===== */
        .filters {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
            background: #fff;
            padding: 12px 16px;
            border-radius: 10px;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            align-items: center;
        }
        .filters input,
        .filters select {
            padding: 7px 12px;
            border: 1px solid #e0e0e0;
            border-radius: 6px;
            font-size: 12px;
            flex: 1;
            min-width: 120px;
            background: #f8f9fa;
            transition: border-color 0.3s;
        }
        .filters input:focus,
        .filters select:focus {
            border-color: #e94560;
            outline: none;
            background: #fff;
        }
        .filters button {
            padding: 7px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.3s;
        }
        .btn-filter {
            background: #e94560;
            color: #fff;
        }
        .btn-filter:hover {
            background: #d63d56;
        }
        .btn-reset {
            background: #f1f2f6;
            color: #636e72;
            border: 1px solid #e0e0e0;
        }
        .btn-reset:hover {
            background: #e9ecef;
        }

        /* ===== GRILLE PRODUITS ===== */
        .product-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
            gap: 16px;
        }

        /* ===== CARTE PRODUIT ===== */
        .product-card {
            background: #fff;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 6px rgba(0,0,0,0.06);
            transition: all 0.3s;
            position: relative;
            display: flex;
            flex-direction: column;
        }
        .product-card:hover {
            transform: translateY(-3px);
            box-shadow: 0 6px 20px rgba(0,0,0,0.1);
        }

        .product-card .image {
            height: 120px;
            background: linear-gradient(135deg, #f5f6fa, #dfe6e9);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 42px;
            position: relative;
            flex-shrink: 0;
        }

        .product-card .badge-stock {
            position: absolute;
            top: 6px;
            right: 6px;
            padding: 2px 10px;
            border-radius: 20px;
            font-size: 10px;
            font-weight: 700;
            z-index: 2;
        }
        .badge-stock.en-stock {
            background: #d4edda;
            color: #155724;
        }
        .badge-stock.stock-faible {
            background: #fff3cd;
            color: #856404;
        }
        .badge-stock.rupture {
            background: #f8d7da;
            color: #721c24;
        }

        .product-card .info {
            padding: 12px 14px 14px;
            flex: 1;
            display: flex;
            flex-direction: column;
        }
        .product-card .info h3 {
            font-size: 14px;
            font-weight: 700;
            color: #1a1a2e;
            margin: 0 0 2px 0;
            line-height: 1.3;
        }
        .product-card .info .ref {
            color: #b2bec3;
            font-size: 10px;
            margin-bottom: 3px;
        }
        .product-card .info .prix {
            font-size: 18px;
            font-weight: 700;
            color: #e94560;
            margin: 4px 0 3px 0;
        }
        .product-card .info .categorie {
            font-size: 11px;
            color: #636e72;
            margin-bottom: 6px;
        }
        .product-card .info .stock-info {
            font-size: 11px;
            color: #636e72;
            margin-bottom: 8px;
            display: flex;
            align-items: center;
            gap: 4px;
        }
        .product-card .info .stock-info .quantite {
            font-weight: 700;
            color: #2d3436;
        }

        .product-card .info .btn-add-cart {
            width: 100%;
            padding: 8px;
            background: #e94560;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: 600;
            font-size: 12px;
            transition: all 0.3s;
            margin-top: auto;
        }
        .product-card .info .btn-add-cart:hover:not(:disabled) {
            background: #d63d56;
        }
        .product-card .info .btn-add-cart:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        .product-card .info .btn-add-cart.added {
            background: #4CAF50;
        }

        /* ===== ÉTAT VIDE ===== */
        .empty-state {
            text-align: center;
            padding: 40px 20px;
            color: #b2bec3;
        }
        .empty-state .icon {
            font-size: 40px;
            margin-bottom: 8px;
        }
        .empty-state h3 {
            color: #2d3436;
            margin-bottom: 4px;
            font-size: 16px;
        }
        .empty-state p {
            font-size: 13px;
        }

        /* ===== CHARGEMENT ===== */
        .loading-products {
            text-align: center;
            padding: 30px;
        }
        .loading-products .spinner {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #e94560;
            border-radius: 50%;
            width: 30px;
            height: 30px;
            animation: spin 1s linear infinite;
            margin: 0 auto 10px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        /* ===== RESPONSIVE ===== */
        @media (max-width: 768px) {
            .client-navbar {
                padding: 10px 15px;
                flex-direction: column;
                align-items: stretch;
            }
            .nav-links {
                flex-wrap: wrap;
                justify-content: center;
                gap: 6px;
            }
            .nav-links a {
                font-size: 11px;
                padding: 3px 8px;
            }
            .language-selector {
                text-align: center;
            }
            .user-info-nav {
                justify-content: center;
                flex-wrap: wrap;
            }
            .catalogue-header {
                padding: 16px;
            }
            .catalogue-header h1 {
                font-size: 20px;
            }
            .products-section {
                padding: 12px;
            }
            .filters {
                padding: 10px 12px;
                gap: 6px;
            }
            .filters input,
            .filters select {
                min-width: 80px;
                font-size: 11px;
                padding: 5px 8px;
            }
            .product-grid {
                grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
                gap: 10px;
            }
            .product-card .image {
                height: 90px;
                font-size: 32px;
            }
            .product-card .info {
                padding: 8px 10px 10px;
            }
            .product-card .info h3 {
                font-size: 12px;
            }
            .product-card .info .prix {
                font-size: 15px;
            }
            .product-card .info .btn-add-cart {
                font-size: 11px;
                padding: 6px;
            }
        }

        @media (max-width: 480px) {
            .product-grid {
                grid-template-columns: 1fr 1fr;
                gap: 8px;
            }
            .product-card .image {
                height: 70px;
                font-size: 24px;
            }
            .filters {
                flex-direction: column;
            }
            .filters input,
            .filters select {
                width: 100%;
                min-width: unset;
            }
        }
    </style>
</head>
<body>
    <!-- ===== NAVBAR ===== -->
    <nav class="client-navbar">
        <div class="brand">
            <h1>🏍️ Capital 2 Roues</h1>
            <small>Votre passion, notre métier</small>
        </div>
        <ul class="nav-links">
            <li><a href="index.html">🏠 Accueil</a></li>
            <li><a href="catalogue.html" class="active">📦 Catalogue</a></li>
            <li><a href="panier.html">🛒 Panier <span class="badge" id="panierCount">0</span></a></li>
            <li><a href="commandes.html">📋 Commandes</a></li>
            <li><a href="profil.html">👤 Profil</a></li>
        </ul>
        
        <div class="language-selector">
            <select id="languageSelector" class="language-select">
                <option value="fr">🇫🇷 Français</option>
                <option value="en">🇬🇧 English</option>
                <option value="ar">🇸🇦 العربية</option>
            </select>
        </div>
        
        <div class="user-info-nav" id="userInfo"></div>
    </nav>

    <!-- ===== HEADER ===== -->
    <div class="catalogue-header">
        <h1>📦 Notre Catalogue</h1>
        <p>Découvrez notre sélection de motos et deux-roues</p>
    </div>

    <!-- ===== CATALOGUE ===== -->
    <section class="products-section">
        <div class="filters">
            <input type="text" id="searchInput" placeholder="🔍 Rechercher un produit...">
            <select id="categoryFilter">
                <option value="">Toutes les catégories</option>
            </select>
            <select id="sortFilter">
                <option value="name">Trier par nom</option>
                <option value="priceAsc">Prix croissant</option>
                <option value="priceDesc">Prix décroissant</option>
                <option value="stock">Stock disponible</option>
            </select>
            <button class="btn-filter" id="filterBtn">🔍 Filtrer</button>
            <button class="btn-reset" id="resetBtn">🔄 Réinitialiser</button>
        </div>

        <div id="productsContainer">
            <div class="loading-products" id="loading">
                <div class="spinner"></div>
                <p>Chargement des produits...</p>
            </div>
        </div>

        <!-- État vide -->
        <div id="empty" style="display:none;">
            <div class="empty-state">
                <div class="icon">📭</div>
                <h3>Aucun produit trouvé</h3>
                <p>Essayez de modifier vos critères de recherche</p>
            </div>
        </div>

        <!-- Erreur -->
        <div id="errorContainer" style="display:none;"></div>
    </section>

    <script>
        /* ==================================================
           CONFIGURATION API
        ================================================== */
        const API_URL = "/api/produits";

        /* ==================================================
           VARIABLES
        ================================================== */
        let products = [];
        let filteredProducts = [];

        /* ==================================================
           ELEMENTS HTML
        ================================================== */
        const productsContainer = document.getElementById("productsContainer");
        const loading = document.getElementById("loading");
        const empty = document.getElementById("empty");
        const errorContainer = document.getElementById("errorContainer");
        const searchInput = document.getElementById("searchInput");
        const categoryFilter = document.getElementById("categoryFilter");
        const sortFilter = document.getElementById("sortFilter");
        const filterBtn = document.getElementById("filterBtn");
        const resetBtn = document.getElementById("resetBtn");

        // ============================================
        // AUTHENTIFICATION / NAVBAR
        // ============================================
        function updateNavbar() {
            const userInfo = document.getElementById('userInfo');
            const isLoggedIn = localStorage.getItem('clientLoggedIn') === 'true';
            if (isLoggedIn) {
                const prenom = localStorage.getItem('clientPrenom') || 'Client';
                const nom = localStorage.getItem('clientNom') || '';
                const initial = prenom.charAt(0).toUpperCase();
                userInfo.innerHTML = `
                    <span class="user-avatar-small">${initial}</span>
                    <span class="user-name-nav">${prenom} ${nom}</span>
                    <button class="btn-logout" onclick="logoutClient()">🚪 Déconnexion</button>
                `;
            } else {
                userInfo.innerHTML = `
                    <a href="login.html"><button class="btn-login">🔐 Se connecter</button></a>
                    <a href="register.html"><button class="btn-login" style="background:#e94560;color:#fff;border-color:#e94560;">S'inscrire</button></a>
                `;
            }
            updatePanierCount();
        }

        function logoutClient() {
            localStorage.removeItem('clientId');
            localStorage.removeItem('clientEmail');
            localStorage.removeItem('clientNom');
            localStorage.removeItem('clientPrenom');
            localStorage.removeItem('clientRole');
            localStorage.removeItem('clientLoggedIn');
            localStorage.removeItem('clientTelephone');
            localStorage.removeItem('clientAdresse');
            window.location.href = 'index.html';
        }

        // ============================================
        // PANIER
        // ============================================
        function updatePanierCount() {
            const panier = JSON.parse(localStorage.getItem('panier')) || [];
            const total = panier.reduce((sum, p) => sum + p.quantite, 0);
            const badge = document.getElementById('panierCount');
            if (badge) badge.textContent = total;
        }

        function ajouterAuPanier(id, nom, prix) {
            const isLoggedIn = localStorage.getItem('clientLoggedIn') === 'true';
            if (!isLoggedIn) {
                if (confirm('Vous devez être connecté pour ajouter au panier. Voulez-vous vous connecter ?')) {
                    window.location.href = 'login.html';
                }
                return;
            }
            
            let panier = JSON.parse(localStorage.getItem('panier')) || [];
            const existing = panier.find(p => p.id === id);
            if (existing) {
                existing.quantite++;
            } else {
                panier.push({ id, nom, prix, quantite: 1 });
            }
            localStorage.setItem('panier', JSON.stringify(panier));
            updatePanierCount();
            
            // Feedback
            const btn = event?.target;
            if (btn) {
                btn.textContent = '✅ Ajouté !';
                btn.classList.add('added');
                setTimeout(() => {
                    btn.textContent = '🛒 Ajouter au panier';
                    btn.classList.remove('added');
                }, 1500);
            }
        }

        /* ==================================================
           CHARGER LES PRODUITS
        ================================================== */
        async function loadProducts() {
            console.log("====================================");
            console.log("Chargement des produits...");
            console.log("API :", API_URL);
            console.log("====================================");

            loading.style.display = "block";
            productsContainer.innerHTML = "";
            empty.style.display = "none";
            errorContainer.style.display = "none";

            try {
                const response = await fetch(API_URL, {
                    method: "GET",
                    headers: {
                        "Accept": "application/json"
                    }
                });

                console.log("Status API :", response.status);

                if (!response.ok) {
                    throw new Error(`Erreur HTTP ${response.status}`);
                }

                const data = await response.json();
                console.log("Réponse API :", data);

                // Récupérer les produits
                if (Array.isArray(data.content)) {
                    products = data.content;
                } else if (Array.isArray(data)) {
                    products = data;
                } else {
                    throw new Error("Format JSON inattendu");
                }

                console.log("Nombre de produits :", products.length);

                // Afficher les catégories
                loadCategories();

                // Afficher les produits
                filteredProducts = [...products];
                applyFilters();

            } catch (error) {
                console.error("Erreur chargement produits :", error);
                showError(error.message);
            } finally {
                loading.style.display = "none";
            }
        }

        /* ==================================================
           CATEGORIES
        ================================================== */
        function loadCategories() {
            categoryFilter.innerHTML = `<option value="">Toutes les catégories</option>`;

            const categories = [...new Set(
                products
                    .map(product => product.categorieNom)
                    .filter(category => category)
            )];

            categories.sort();

            categories.forEach(category => {
                const option = document.createElement("option");
                option.value = category;
                option.textContent = category;
                categoryFilter.appendChild(option);
            });
        }

        /* ==================================================
           FILTRES
        ================================================== */
        function applyFilters() {
            const search = searchInput.value.trim().toLowerCase();
            const category = categoryFilter.value;

            filteredProducts = products.filter(product => {
                const matchesSearch = !search ||
                    String(product.nom || "").toLowerCase().includes(search) ||
                    String(product.reference || "").toLowerCase().includes(search) ||
                    String(product.categorieNom || "").toLowerCase().includes(search);

                const matchesCategory = !category || product.categorieNom === category;

                return matchesSearch && matchesCategory;
            });

            applySort();
            renderProducts();
        }

        /* ==================================================
           TRI
        ================================================== */
        function applySort() {
            const sort = sortFilter.value;

            if (sort === "name") {
                filteredProducts.sort((a, b) =>
                    String(a.nom || "").localeCompare(String(b.nom || ""))
                );
            } else if (sort === "priceAsc") {
                filteredProducts.sort((a, b) =>
                    Number(a.prixVente || 0) - Number(b.prixVente || 0)
                );
            } else if (sort === "priceDesc") {
                filteredProducts.sort((a, b) =>
                    Number(b.prixVente || 0) - Number(a.prixVente || 0)
                );
            } else if (sort === "stock") {
                filteredProducts.sort((a, b) =>
                    Number(b.quantiteStock || 0) - Number(a.quantiteStock || 0)
                );
            }
        }

        /* ==================================================
           AFFICHER LES PRODUITS
        ================================================== */
        function renderProducts() {
            productsContainer.innerHTML = "";

            if (filteredProducts.length === 0) {
                empty.style.display = "block";
                return;
            }

            empty.style.display = "none";

            // Créer la grille
            const grid = document.createElement("div");
            grid.className = "product-grid";

            filteredProducts.forEach(product => {
                const card = createProductCard(product);
                grid.appendChild(card);
            });

            productsContainer.appendChild(grid);
        }

        /* ==================================================
           CREER CARTE PRODUIT
        ================================================== */
        function createProductCard(product) {
            const card = document.createElement("article");
            card.className = "product-card";

            const stock = Number(product.quantiteStock || 0);
            let stockClass = "en-stock";
            let stockText = "✅ En stock";

            if (stock <= 0) {
                stockClass = "rupture";
                stockText = "❌ Rupture";
            } else if (stock <= 2) {
                stockClass = "stock-faible";
                stockText = `⚠️ Stock limité (${stock})`;
            }

            const name = escapeHTML(product.nom || "Produit");
            const reference = escapeHTML(product.reference || "-");
            const category = escapeHTML(product.categorieNom || "Non catégorisé");
            const price = formatPrice(product.prixVente);

            const disabled = stock <= 0 ? 'disabled' : '';
            const buttonText = disabled ? '❌ Indisponible' : '🛒 Ajouter au panier';

            card.innerHTML = `
                <div class="image">
                    <span>🏍️</span>
                    <span class="badge-stock ${stockClass}">${stockText}</span>
                </div>
                <div class="info">
                    <h3>${name}</h3>
                    <div class="ref">${reference}</div>
                    <div class="prix">${price} DH</div>
                    <div class="categorie">${category}</div>
                    <div class="stock-info">
                        <span>Stock :</span>
                        <span class="quantite">${stock}</span>
                    </div>
                    <button class="btn-add-cart" onclick="ajouterAuPanier(${product.id}, '${name}', ${product.prixVente})" ${disabled}>
                        ${buttonText}
                    </button>
                </div>
            `;

            return card;
        }

        /* ==================================================
           FORMAT PRIX
        ================================================== */
        function formatPrice(price) {
            const number = Number(price || 0);
            return number.toLocaleString("fr-FR", {
                minimumFractionDigits: 0,
                maximumFractionDigits: 2
            });
        }

        /* ==================================================
           SECURITE HTML
        ================================================== */
        function escapeHTML(value) {
            if (!value) return '';
            return String(value)
                .replace(/&/g, "&amp;")
                .replace(/</g, "&lt;")
                .replace(/>/g, "&gt;")
                .replace(/"/g, "&quot;")
                .replace(/'/g, "&#039;");
        }

        /* ==================================================
           AFFICHER ERREUR
        ================================================== */
        function showError(message) {
            errorContainer.style.display = "block";
            errorContainer.innerHTML = `
                <div style="background:#ffe5e8;color:#b4233d;padding:20px;border-radius:10px;text-align:center;">
                    ❌ Impossible de charger les produits.<br><br>
                    <strong>${escapeHTML(message)}</strong><br>
                    <button onclick="loadProducts()" style="margin-top:12px;padding:8px 20px;border:none;background:#e94560;color:white;border-radius:6px;cursor:pointer;font-weight:600;">
                        🔄 Réessayer
                    </button>
                </div>
            `;
        }

        // ============================================
        // FILTRE (fonction appelée par les boutons)
        // ============================================
        function filterProducts() {
            applyFilters();
        }

        function resetFilter() {
            searchInput.value = '';
            categoryFilter.value = '';
            sortFilter.value = 'name';
            filteredProducts = [...products];
            applyFilters();
        }

        /* ==================================================
           EVENEMENTS
        ================================================== */
        filterBtn.addEventListener("click", applyFilters);
        searchInput.addEventListener("input", applyFilters);
        categoryFilter.addEventListener("change", applyFilters);
        sortFilter.addEventListener("change", applyFilters);

        resetBtn.addEventListener("click", function() {
            searchInput.value = "";
            categoryFilter.value = "";
            sortFilter.value = "name";
            filteredProducts = [...products];
            applyFilters();
        });

        /* ==================================================
           DEMARRAGE
        ================================================== */
        document.addEventListener("DOMContentLoaded", function() {
            updateNavbar();
            loadProducts();
        });

        // Exposer les fonctions globalement
        window.filterProducts = filterProducts;
        window.resetFilter = resetFilter;
        window.ajouterAuPanier = ajouterAuPanier;
        window.logoutClient = logoutClient;
    </script>
</body>
</html>
