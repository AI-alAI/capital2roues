<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Capital 2 Roues</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
    <style>
        /* ============================================
                   RESET & BASE
                   ============================================ */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', sans-serif;
            min-height: 100vh;
            background: #0a0a0f;
            color: #fff;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* ============================================
                   BACKGROUND EFFECTS
                   ============================================ */
        .bg-overlay {
            position: fixed;
            inset: 0;
            z-index: 0;
            background:
                radial-gradient(ellipse at 20% 50%, rgba(233, 69, 96, 0.08) 0%, transparent 60%),
                radial-gradient(ellipse at 80% 50%, rgba(33, 150, 243, 0.05) 0%, transparent 60%),
                radial-gradient(ellipse at 50% 100%, rgba(233, 69, 96, 0.04) 0%, transparent 40%);
        }

        .bg-grid {
            position: fixed;
            inset: 0;
            z-index: 0;
            background-image:
                linear-gradient(rgba(255, 255, 255, 0.02) 1px, transparent 1px),
                linear-gradient(90deg, rgba(255, 255, 255, 0.02) 1px, transparent 1px);
            background-size: 60px 60px;
            opacity: 0.5;
        }

        /* ============================================
                   GLOW EFFECTS
                   ============================================ */
        .glow {
            position: fixed;
            border-radius: 50%;
            filter: blur(80px);
            z-index: 0;
            pointer-events: none;
        }

        .glow-1 {
            width: 400px;
            height: 400px;
            background: rgba(233, 69, 96, 0.15);
            top: -100px;
            right: -100px;
            animation: pulseGlow 8s ease-in-out infinite;
        }

        .glow-2 {
            width: 300px;
            height: 300px;
            background: rgba(33, 150, 243, 0.10);
            bottom: -50px;
            left: -50px;
            animation: pulseGlow 10s ease-in-out infinite reverse;
        }

        .glow-3 {
            width: 200px;
            height: 200px;
            background: rgba(233, 69, 96, 0.08);
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            animation: pulseGlow 12s ease-in-out infinite;
        }

        @keyframes pulseGlow {
            0%, 100% { transform: scale(1); opacity: 0.6; }
            50% { transform: scale(1.3); opacity: 1; }
        }

        /* ============================================
                   MAIN CONTAINER
                   ============================================ */
        .hero {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 1200px;
            padding: 40px;
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 60px;
            align-items: center;
            min-height: 100vh;
        }

        /* ============================================
                   LEFT SIDE - CONTENT
                   ============================================ */
        .hero-content {
            display: flex;
            flex-direction: column;
            gap: 30px;
        }

        /* Badge */
        .badge {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            background: rgba(233, 69, 96, 0.12);
            border: 1px solid rgba(233, 69, 96, 0.15);
            padding: 8px 20px 8px 16px;
            border-radius: 50px;
            font-size: 13px;
            color: rgba(255, 255, 255, 0.7);
            width: fit-content;
            font-weight: 500;
            letter-spacing: 0.3px;
        }

        .badge .dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: #4CAF50;
            animation: pulseDot 2s ease-in-out infinite;
        }

        @keyframes pulseDot {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.5; transform: scale(1.3); }
        }

        /* Title */
        .hero-title {
            font-size: 56px;
            font-weight: 900;
            line-height: 1.1;
            letter-spacing: -1px;
        }

        .hero-title .highlight {
            background: linear-gradient(135deg, #e94560, #ff6b81);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        .hero-title .highlight-blue {
            background: linear-gradient(135deg, #2196F3, #64B5F6);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }

        /* Description */
        .hero-description {
            font-size: 18px;
            color: rgba(255, 255, 255, 0.5);
            line-height: 1.8;
            max-width: 500px;
            font-weight: 300;
        }

        /* Stats */
        .hero-stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 20px;
            padding-top: 10px;
        }

        .stat-item {
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.04);
            border-radius: 12px;
            padding: 16px 20px;
            text-align: center;
            transition: all 0.3s ease;
        }

        .stat-item:hover {
            background: rgba(255, 255, 255, 0.06);
            transform: translateY(-2px);
            border-color: rgba(233, 69, 96, 0.15);
        }

        .stat-item .number {
            font-size: 28px;
            font-weight: 700;
            color: #fff;
            display: block;
        }

        .stat-item .label {
            font-size: 13px;
            color: rgba(255, 255, 255, 0.4);
            font-weight: 400;
            margin-top: 2px;
        }

        /* Buttons */
        .hero-buttons {
            display: flex;
            gap: 16px;
            flex-wrap: wrap;
            margin-top: 10px;
        }

        .btn-primary {
            padding: 16px 40px;
            background: linear-gradient(135deg, #e94560, #c62840);
            color: #fff;
            border: none;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            box-shadow: 0 10px 30px rgba(233, 69, 96, 0.25);
            font-family: 'Inter', sans-serif;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            box-shadow: 0 20px 40px rgba(233, 69, 96, 0.35);
        }

        .btn-secondary {
            padding: 16px 35px;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #fff;
            border-radius: 12px;
            font-size: 16px;
            font-weight: 500;
            cursor: pointer;
            text-decoration: none;
            display: inline-flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            font-family: 'Inter', sans-serif;
        }

        .btn-secondary:hover {
            background: rgba(255, 255, 255, 0.1);
            border-color: rgba(255, 255, 255, 0.15);
            transform: translateY(-3px);
        }

        .btn-secondary .arrow {
            transition: transform 0.3s ease;
        }

        .btn-secondary:hover .arrow {
            transform: translateX(4px);
        }

        /* ============================================
                   RIGHT SIDE - 3D MOTO
                   ============================================ */
        .hero-visual {
            display: flex;
            justify-content: center;
            align-items: center;
            perspective: 800px;
        }

        .moto-3d {
            position: relative;
            width: 380px;
            height: 380px;
            display: flex;
            justify-content: center;
            align-items: center;
            transform-style: preserve-3d;
            animation: floatMoto 4s ease-in-out infinite;
        }

        @keyframes floatMoto {
            0%, 100% { transform: translateY(0px) rotateY(-5deg); }
            50% { transform: translateY(-20px) rotateY(5deg); }
        }

        .moto-3d .emoji {
            font-size: 160px;
            filter: drop-shadow(0 20px 60px rgba(233, 69, 96, 0.2));
            animation: rotateMoto 12s linear infinite;
            user-select: none;
        }

        @keyframes rotateMoto {
            0% { transform: rotateY(0deg); }
            100% { transform: rotateY(360deg); }
        }

        /* ===== RINGS ===== */
        .ring {
            position: absolute;
            border-radius: 50%;
            border: 1px solid rgba(233, 69, 96, 0.08);
            animation: ringPulse 8s ease-in-out infinite;
        }

        .ring-1 {
            width: 300px;
            height: 300px;
            animation-delay: 0s;
        }
        .ring-2 {
            width: 380px;
            height: 380px;
            animation-delay: -2s;
        }
        .ring-3 {
            width: 460px;
            height: 460px;
            animation-delay: -4s;
        }
        .ring-4 {
            width: 540px;
            height: 540px;
            animation-delay: -6s;
        }

        @keyframes ringPulse {
            0%, 100% { transform: scale(1); opacity: 0.3; }
            50% { transform: scale(1.05); opacity: 0.6; }
        }

        /* ============================================
                   FOOTER
                   ============================================ */
        .footer {
            position: fixed;
            bottom: 30px;
            left: 0;
            width: 100%;
            text-align: center;
            z-index: 1;
            padding: 0 20px;
        }

        .footer p {
            color: rgba(255, 255, 255, 0.1);
            font-size: 13px;
            font-weight: 300;
            letter-spacing: 1px;
        }

        .footer p span {
            color: rgba(233, 69, 96, 0.3);
        }

        /* ============================================
                   RESPONSIVE
                   ============================================ */
        @media (max-width: 992px) {
            .hero {
                grid-template-columns: 1fr;
                text-align: center;
                gap: 30px;
                padding: 30px 20px;
                min-height: auto;
                padding-top: 60px;
                padding-bottom: 80px;
            }

            .hero-content {
                align-items: center;
            }

            .hero-title {
                font-size: 40px;
            }

            .hero-description {
                max-width: 100%;
            }

            .hero-stats {
                width: 100%;
                max-width: 400px;
            }

            .moto-3d .emoji {
                font-size: 120px;
            }

            .moto-3d {
                width: 300px;
                height: 300px;
            }

            .ring-1 { width: 240px; height: 240px; }
            .ring-2 { width: 300px; height: 300px; }
            .ring-3 { width: 360px; height: 360px; }
            .ring-4 { width: 420px; height: 420px; }

            .hero-buttons {
                justify-content: center;
            }
        }

        @media (max-width: 576px) {
            .hero-title {
                font-size: 30px;
            }

            .hero-description {
                font-size: 15px;
            }

            .hero-stats {
                grid-template-columns: 1fr 1fr 1fr;
                gap: 10px;
            }

            .stat-item {
                padding: 12px 10px;
            }

            .stat-item .number {
                font-size: 20px;
            }

            .stat-item .label {
                font-size: 11px;
            }

            .moto-3d .emoji {
                font-size: 80px;
            }

            .moto-3d {
                width: 220px;
                height: 220px;
            }

            .ring-1 { width: 180px; height: 180px; }
            .ring-2 { width: 230px; height: 230px; }
            .ring-3 { width: 280px; height: 280px; }
            .ring-4 { width: 330px; height: 330px; }

            .badge {
                font-size: 11px;
                padding: 6px 14px 6px 10px;
            }

            .btn-primary, .btn-secondary {
                width: 100%;
                justify-content: center;
                padding: 14px 20px;
                font-size: 14px;
            }

            .hero-buttons {
                flex-direction: column;
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <!-- ===== BACKGROUND EFFECTS ===== -->
    <div class="bg-overlay"></div>
    <div class="bg-grid"></div>

    <!-- ===== GLOW EFFECTS ===== -->
    <div class="glow glow-1"></div>
    <div class="glow glow-2"></div>
    <div class="glow glow-3"></div>

    <!-- ===== HERO ===== -->
    <div class="hero">
        <!-- ===== LEFT CONTENT ===== -->
        <div class="hero-content">
            <!-- Badge -->
            <div class="badge">
                <span class="dot"></span>
                Système en ligne
            </div>

            <!-- Title -->
            <h1 class="hero-title">
                <span class="highlight">Capital</span><br>
                <span class="highlight-blue">2 Roues</span>
            </h1>

            <!-- Description -->
            <p class="hero-description">
                La solution complète de gestion pour votre entreprise de motos.
                Gérez vos <strong style="color:rgba(255,255,255,0.7);">produits</strong>,
                vos <strong style="color:rgba(255,255,255,0.7);">clients</strong>,
                vos <strong style="color:rgba(255,255,255,0.7);">ventes</strong>
                et vos <strong style="color:rgba(255,255,255,0.7);">réclamations</strong>
                en un seul endroit.
            </p>

            <!-- Stats -->
            <div class="hero-stats">
                <div class="stat-item">
                    <span class="number">🏍️ 3+</span>
                    <span class="label">Produits</span>
                </div>
                <div class="stat-item">
                    <span class="number">👥 5+</span>
                    <span class="label">Clients</span>
                </div>
                <div class="stat-item">
                    <span class="number">🛒 1</span>
                    <span class="label">Vente</span>
                </div>
            </div>

            <!-- Buttons -->
            <div class="hero-buttons">
                <a href="pages/login.html" class="btn-primary">
                    🚀 Accéder
                </a>
                <a href="client/index.html" class="btn-secondary">
                    Espace Client
                    <span class="arrow">→</span>
                </a>
            </div>
        </div>

        <!-- ===== RIGHT VISUAL ===== -->
        <div class="hero-visual">
            <div class="moto-3d">
                <!-- Rings -->
                <div class="ring ring-1"></div>
                <div class="ring ring-2"></div>
                <div class="ring ring-3"></div>
                <div class="ring ring-4"></div>
                <!-- Emoji -->
                <span class="emoji">🏍️</span>
            </div>
        </div>
    </div>

    <!-- ===== FOOTER ===== -->
    <div class="footer">
        <p>&copy; 2026 <span>Capital 2 Roues</span> — Tous droits réservés</p>
    </div>
</body>
</html>
